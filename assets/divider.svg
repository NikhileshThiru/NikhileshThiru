<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-label="section divider" preserveAspectRatio="none">
  <title>divider</title>

  <!--
    Uneven dash rail. The colour is one gradient shared by every dash and scrolled with
    SMIL, so the hue appears to travel along the row rather than each dash animating.
    The stop pattern repeats every 900 user units, which is exactly the translate
    distance, so the loop has no visible seam.
  -->

  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="-900" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#8957E5"/>
      <stop offset="0.125" stop-color="#A371F7"/>
      <stop offset="0.25" stop-color="#58A6FF"/>
      <stop offset="0.375" stop-color="#7EE7FF"/>
      <stop offset="0.5" stop-color="#8957E5"/>
      <stop offset="0.625" stop-color="#A371F7"/>
      <stop offset="0.75" stop-color="#58A6FF"/>
      <stop offset="0.875" stop-color="#7EE7FF"/>
      <stop offset="1" stop-color="#8957E5"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="900 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g fill="url(#flow)">
    <rect x="0" y="5.5" width="26" height="3" rx="1.5" opacity="0.95"/>
    <rect x="32" y="5.5" width="7" height="3" rx="1.5" opacity="0.5"/>
    <rect x="43" y="5.5" width="14" height="3" rx="1.5" opacity="0.8"/>
    <rect x="64" y="5.5" width="4" height="3" rx="1.5" opacity="0.4"/>
    <rect x="73" y="5.5" width="38" height="3" rx="1.5" opacity="1"/>
    <rect x="117" y="5.5" width="9" height="3" rx="1.5" opacity="0.6"/>
    <rect x="130" y="5.5" width="3" height="3" rx="1.5" opacity="0.35"/>
    <rect x="141" y="5.5" width="21" height="3" rx="1.5" opacity="0.85"/>
    <rect x="167" y="5.5" width="52" height="3" rx="1.5" opacity="1"/>
    <rect x="225" y="5.5" width="6" height="3" rx="1.5" opacity="0.45"/>
    <rect x="235" y="5.5" width="12" height="3" rx="1.5" opacity="0.7"/>
    <rect x="254" y="5.5" width="30" height="3" rx="1.5" opacity="0.9"/>
    <rect x="289" y="5.5" width="4" height="3" rx="1.5" opacity="0.4"/>
    <rect x="297" y="5.5" width="17" height="3" rx="1.5" opacity="0.75"/>
    <rect x="320" y="5.5" width="8" height="3" rx="1.5" opacity="0.5"/>
    <rect x="333" y="5.5" width="44" height="3" rx="1.5" opacity="1"/>
    <rect x="384" y="5.5" width="5" height="3" rx="1.5" opacity="0.4"/>
    <rect x="393" y="5.5" width="25" height="3" rx="1.5" opacity="0.85"/>
    <rect x="424" y="5.5" width="3" height="3" rx="1.5" opacity="0.35"/>
    <rect x="432" y="5.5" width="11" height="3" rx="1.5" opacity="0.6"/>
    <rect x="447" y="5.5" width="60" height="3" rx="1.5" opacity="0.95"/>
    <rect x="514" y="5.5" width="7" height="3" rx="1.5" opacity="0.5"/>
    <rect x="526" y="5.5" width="19" height="3" rx="1.5" opacity="0.8"/>
    <rect x="551" y="5.5" width="4" height="3" rx="1.5" opacity="0.4"/>
    <rect x="559" y="5.5" width="33" height="3" rx="1.5" opacity="1"/>
    <rect x="598" y="5.5" width="9" height="3" rx="1.5" opacity="0.6"/>
    <rect x="612" y="5.5" width="14" height="3" rx="1.5" opacity="0.35"/>
    <rect x="633" y="5.5" width="3" height="3" rx="1.5" opacity="0.85"/>
    <rect x="640" y="5.5" width="48" height="3" rx="1.5" opacity="1"/>
    <rect x="694" y="5.5" width="6" height="3" rx="1.5" opacity="0.45"/>
    <rect x="705" y="5.5" width="22" height="3" rx="1.5" opacity="0.7"/>
    <rect x="731" y="5.5" width="11" height="3" rx="1.5" opacity="0.9"/>
    <rect x="749" y="5.5" width="4" height="3" rx="1.5" opacity="0.4"/>
    <rect x="758" y="5.5" width="29" height="3" rx="1.5" opacity="0.75"/>
    <rect x="793" y="5.5" width="8" height="3" rx="1.5" opacity="0.5"/>
    <rect x="805" y="5.5" width="36" height="3" rx="1.5" opacity="1"/>
    <rect x="847" y="5.5" width="5" height="3" rx="1.5" opacity="0.4"/>
    <rect x="857" y="5.5" width="15" height="3" rx="1.5" opacity="0.85"/>
    <rect x="876" y="5.5" width="3" height="3" rx="1.5" opacity="0.35"/>
    <rect x="886" y="5.5" width="14" height="3" rx="1.5" opacity="0.6"/>
  </g>
</svg>
