name: build readme

# README.md is a build artifact. This regenerates it from README.template.md and commits
# the result only when it actually changed. The commit carries [skip ci] so the push
# trigger below cannot start a second run off this job's own commit.

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: scripts/build.mjs has no dependencies and uses global fetch.
      - name: generate README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs

      - name: commit if changed
        run: |
          if [ -z "$(git status --porcelain -- README.md)" ]; then
            echo "README.md is unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: rebuild README [skip ci]"
          git push
